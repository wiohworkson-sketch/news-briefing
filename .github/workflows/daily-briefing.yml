name: 아침 뉴스 브리핑

on:
  schedule:
    # GitHub 시간은 UTC 기준입니다. 21:15 UTC = 한국시간 06:15
    # (GitHub 예약 실행은 늦어질 수 있어 미리 시작하고, 07:00까지 기다렸다가 발송합니다)
    - cron: "15 21 * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "기다리지 않고 바로 카톡 발송"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-briefing

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  STATE_KEY: ${{ secrets.STATE_KEY }}
  KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
  KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -r requirements.txt

      - name: 뉴스 수집 및 브리핑 작성
        run: python main.py build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 웹페이지 게시
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs
          git commit -m "브리핑 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - name: 카톡 발송
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python main.py send --at 07:00
          else
            python main.py send
          fi

      - name: 카카오 로그인 연장 정보 저장
        if: always()
        run: |
          git add state || true
          git commit -m "카카오 로그인 자동 연장" || exit 0
          git pull --rebase && git push

      - name: 실패 알림
        if: failure()
        run: python main.py notify-error || true
