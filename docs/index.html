<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>아침 뉴스 브리핑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--soft:#efede6;--text:#1f1e1c;--sub:#5f5e5a;--muted:#8a8984;--line:#e3e1d9;
  --up:#d03b3b;--down:#2563c9;--accent:#2563c9;
  --c0:#d85a30;--c1:#534ab7;--c2:#1d9e75;--c3:#ba7517;--c4:#993556;--c5:#185fa5;
  --kr-bg:#e6f3e0;--kr-tx:#2f6b14;--fx-bg:#eceafd;--fx-tx:#4a40a8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161615;--card:#21211f;--soft:#2b2b28;--text:#ecebe6;--sub:#b5b3ab;--muted:#86857f;--line:#363632;
  --up:#ff6b6b;--down:#6aa5ff;--accent:#6aa5ff;
  --c0:#f0997b;--c1:#afa9ec;--c2:#5dcaa5;--c3:#ef9f27;--c4:#ed93b1;--c5:#85b7eb;
  --kr-bg:#27401a;--kr-tx:#b7e08c;--fx-bg:#2f2a5c;--fx-tx:#cecbf6;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
a{color:inherit}
header h1{font-size:30px;margin:0;font-weight:700}
.meta{color:var(--muted);font-size:15px;margin-top:2px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
select,button,input{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px}
button{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.m .n{font-size:14px;color:var(--sub)}
.m .v{font-size:22px;font-weight:700;line-height:1.3}
.m .c{font-size:14px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.mc{font-size:15px;color:var(--sub);margin:6px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;scroll-margin-top:12px}
.card h2{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.hl{margin:0;padding:0;list-style:none}
.hl li{font-size:19px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--line)}
.hl li:last-child{border:none}
.ins p{margin:0 0 10px;font-size:18px}
.easy{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.easy .et{font-weight:700;font-size:16px;margin-bottom:6px;color:var(--accent)}
.easy .er{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:17px;padding:4px 0}
.easy .er b{color:var(--accent)}
.easy .er.sub{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.easy .er.sub b{color:var(--c2)}
.easy .er.sub + .er.sub{border-top:none;margin-top:0;padding-top:4px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none;padding-top:2px}
.item h3{font-size:19px;margin:0 0 3px;font-weight:700}
.item p{margin:0 0 4px;font-size:17px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.src a{font-size:13px;text-decoration:none;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub)}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;font-weight:500}
.kr{background:var(--kr-bg);color:var(--kr-tx)}.fx{background:var(--fx-bg);color:var(--fx-tx)}
.pv{padding:10px 0;border-top:1px solid var(--line)}
.pv:first-of-type{border:none;padding-top:0}
.pv b{display:block;margin-bottom:4px}
.pv div{font-size:17px;margin:2px 0}
.sc{display:grid;grid-template-columns:62px 44px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:17px}
.sc:first-of-type{border:none}
.sc .t{font-weight:700}.sc .r{color:var(--muted);font-size:12px;padding-top:2px}
.kw{margin-top:10px}
.kw h3{font-size:18px;margin:0 0 4px}
.kw .none{font-size:13px;color:var(--muted)}
#lock{max-width:360px;margin:18vh auto 0;text-align:center}
#lock h1{font-size:22px}
#lock input{width:100%;margin:12px 0 8px;padding:12px}
#lock button{width:100%;padding:12px;background:var(--text);color:var(--bg);border:none;font-weight:700}
.err{color:var(--up);font-size:14px;min-height:20px}
.toc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin-top:12px}
.toc a{flex:none;font-size:15px;text-decoration:none;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
.mkt .nf{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:16px;margin-bottom:10px}
.mkt .op{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.mkt .op b{min-width:52px;font-size:17px}
.badge{padding:3px 10px;border-radius:8px;font-weight:700;font-size:16px;white-space:nowrap}
.b-갭상승{background:#dc2626;color:#fff}.b-강보합{background:#fee2e2;color:#b91c1c}.b-보합{background:#e5e7eb;color:#374151}
.b-약보합{background:#dbeafe;color:#1d4ed8}.b-갭하락{background:#2563eb;color:#fff}
.mkt h3{font-size:17px;margin:14px 0 6px}
.mkt ul{margin:0;padding-left:18px;font-size:16px}
.sc2{border-radius:12px;padding:10px 12px;margin-top:8px}
.sc2.up{background:color-mix(in srgb,var(--up) 10%,transparent)}.sc2.dn{background:color-mix(in srgb,var(--down) 10%,transparent)}
.sc2 .r{display:grid;grid-template-columns:80px 1fr;gap:6px;padding:4px 0;font-size:15.5px}
.sc2 .st{font-weight:700}.sc2.up .st{color:var(--up)}.sc2.dn .st{color:var(--down)}
.warn{font-size:12.5px;color:var(--muted);margin-top:10px}


/* ───── 세션 제목 색깔 띠: 남색 = 장 전망·핵심·시사점 / 청록 = 뉴스 분야 ───── */
:root{--band-a:#1e3a8a;--band-b:#0f766e}
.card.ga,.card.gb{overflow:hidden}
.card.ga h2,.card.gb h2{margin:-16px -18px 12px;padding:9px 18px;color:#fff}
.card.ga h2{background:var(--band-a)}
.card.gb h2{background:var(--band-b)}
.card.ga h2 .dot,.card.gb h2 .dot{display:none}
@media print{
  .card.ga h2,.card.gb h2{margin:-2.2mm -2.8mm 1.6mm;padding:1.3mm 2.8mm;font-size:10.5pt}
}
/* ───── A3 한 장 인쇄 ───── */
.print-btn{font-size:14px;padding:7px 12px;margin-left:6px}
.print-only{display:none}
@page{size:A3 portrait;margin:9mm}
@media print{
  :root,:root:not([data-theme="light"]){
    --bg:#fff;--card:#fff;--soft:#f1f0eb;--text:#111;--sub:#444;--muted:#666;--line:#d6d4cc;
    --up:#c62828;--down:#1d4ed8;--accent:#1d4ed8;--c2:#0f7a5a;
    --kr-bg:#e6f3e0;--kr-tx:#2f6b14;--fx-bg:#eceafd;--fx-tx:#4a40a8;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;font-size:8.4pt;line-height:1.38}
  .wrap{max-width:none;padding:0}
  #day,.toc,.print-btn,footer{display:none!important}
  .print-only{display:block}
  #app{column-count:3;column-gap:5mm;column-fill:balance;zoom:var(--pz,1.1)}
  header,#app>.grid,#app>.mc{column-span:all}
  header h1{font-size:17pt}
  header .bar{margin-bottom:2mm;align-items:flex-end}
  .meta{font-size:7.5pt}
  #app>.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:2mm;margin:0 0 1mm}
  .m{padding:1.2mm 2mm;border-radius:4px}
  .m .n{font-size:7pt}.m .v{font-size:10.5pt}.m .c{font-size:7.5pt}
  .mc{font-size:7.8pt;margin:0 0 3mm}
  .card{break-inside:avoid;page-break-inside:avoid;border:0.6pt solid var(--line);border-radius:5px;
        padding:2.2mm 2.8mm;margin:0 0 3mm;display:block}
  .card h2{font-size:10.5pt;margin:0 0 1.5mm;gap:4px}
  .hl li{font-size:9pt;padding:0.6mm 0}
  .ins p{font-size:8.2pt;margin:0 0 1mm}
  .easy{padding:1.6mm 2.2mm;margin-bottom:1.6mm;border-radius:4px}
  .easy .et{font-size:8pt;margin-bottom:0.6mm}
  .easy .er{font-size:8.2pt;grid-template-columns:15mm 1fr;gap:1.5mm;padding:0.4mm 0}
  .item{padding:1.2mm 0}
  .item h3{font-size:8.8pt;margin:0 0 0.4mm}
  .item p{font-size:8pt;margin:0 0 0.4mm}
  .src{gap:1mm;margin-top:0.4mm}
  .src a{font-size:6.6pt;padding:0 1.4mm}
  .tag{font-size:6.2pt;padding:0 1mm}
  .pv{padding:1mm 0}.pv div{font-size:8pt;margin:0.3mm 0}
  .sc{grid-template-columns:12mm 9mm 1fr;font-size:8pt;padding:0.6mm 0}
  .kw{margin-top:1mm}.kw h3{font-size:8.6pt;margin:0 0 0.4mm}.kw .none{font-size:7.5pt}
  .mkt .nf{font-size:8.2pt;padding:1.2mm 2mm;margin:1.4mm 0!important}
  .mkt .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4mm}
  .mkt h3{font-size:8.8pt;margin:1.8mm 0 0.6mm}
  .mkt .op{font-size:8pt;gap:1.6mm;padding:0.4mm 0}
  .mkt .op b{min-width:9mm;font-size:8.4pt}
  .badge{font-size:7.8pt;padding:0.2mm 1.6mm}
  .mkt ul{font-size:8pt;padding-left:4mm}
  .sc2{padding:1.4mm 2mm;margin-top:1.2mm;border-radius:4px}
  .sc2 .r{grid-template-columns:13mm 1fr;font-size:7.8pt;gap:1mm;padding:0.4mm 0}
  .warn{font-size:6.8pt;margin-top:1mm}
  .print-foot{column-span:all;font-size:7pt;color:var(--muted);text-align:center;margin-top:1mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="lock" hidden>
    <h1>☀️ 아침 뉴스 브리핑</h1>
    <div class="err" id="err"></div>
  </div>
  <div id="app" hidden></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONS = {"증시·경제":"📈","부동산":"🏠","정치·국제":"🌏","IT·AI":"💻","바이오·제약":"💊","사회·생활":"🏙️"};
let dates = [];
const pz = new URLSearchParams(location.search).get("pz");
if (pz && /^[0-9.]+$/.test(pz)) document.documentElement.style.setProperty("--pz", pz);

async function getJSON(p){ const r = await fetch(p, {cache:"no-store"}); if(!r.ok) throw new Error(p); return r.json(); }

function sources(page, ids){
  const seen = new Set();
  const list = (ids||[]).map(i => page.articles[i]).filter(a => a && !seen.has(a.source) && seen.add(a.source)).slice(0, 4);
  return `<div class="src">${list.map(a =>
    `<a href="${esc(a.url)}" target="_blank" rel="noopener"><span class="tag ${a.origin==="국내"?"kr":"fx"}">${esc(a.origin)}</span>${esc(a.source)}</a>`).join("")}</div>`;
}
function item(page, it){
  return `<div class="item"><h3>${esc(it.title)}</h3><p>${esc(it.summary)}</p>${sources(page, it.article_ids)}</div>`;
}

function render(page){
  const b = page.briefing, arrow = {up:"▲", down:"▼", flat:""};
  const opts = dates.map(d => `<option value="${d}" ${d===page.date?"selected":""}>${d}</option>`).join("");
  $("#app").innerHTML = `
  <header>
    <div class="bar"><div><h1>${esc(page.date_label)} 아침 브리핑</h1>
      <div class="meta">기사 ${page.article_count}건 분석 · ${esc(page.generated_at)} 생성</div></div>
      <div><select id="day" aria-label="지난 브리핑">${opts}</select><button class="print-btn" onclick="printA3('${page.date}')">🖨 A3 인쇄</button></div></div>
  </header>
  <div class="grid">${page.markets.map(m => `<div class="m"><div class="n">${esc(m.name)}</div><div class="v">${esc(m.text)}</div>
    <div class="c ${m.direction}">${arrow[m.direction]} ${esc(m.change)}</div></div>`).join("")}</div>
  <div class="mc">${esc(b.market_comment)}</div>
  <nav class="toc">${b.market ? '<a href="#market">장 전망</a>' : ""}<a href="#top3">핵심</a><a href="#insight">시사점</a>${b.sections.map((s,i)=>`<a href="#sec-${i}">${esc(s.name)}</a>`).join("")}<a href="#views">국내vs외신</a><a href="#sched">일정</a><a href="#kw">키워드</a></nav>
  ${b.market ? (() => { const m = b.market;
    const calls = (arr, cls, title) => arr && arr.length ? `<div class="sc2 ${cls}"><b>${title}</b>${arr.map(c=>`<div class="r"><b>${esc(c.sector)}</b><span>${esc(c.reason)}${c.stocks.length?`<br><span class="st">${c.stocks.map(esc).join(", ")}</span>`:""}</span></div>`).join("")}</div>` : "";
    const op = (n, v, r) => `<div class="op"><b>${n}</b><span class="badge b-${esc(v)}">${esc(v)}</span><span>${esc(r)}</span></div>`;
    return `<section class="card mkt ga" id="market"><h2>📊 오늘 장 전망</h2>
    <div class="meta" style="margin:-4px 0 8px">전일 마감 기준${(page.outlook_markets||[]).find(x=>x.date) ? " · " + esc((page.outlook_markets.map(x=>x.date).filter(Boolean).sort().pop())) : ""} (예상치 아님)</div>
    <div class="grid" style="margin-top:0">${(page.outlook_markets||[]).map(x => `<div class="m"><div class="n">${esc(x.name)}</div><div class="v">${esc(x.text)}</div><div class="c ${x.direction}">${arrow[x.direction]} ${esc(x.change)}</div></div>`).join("")}</div>
    <div class="nf" style="margin-top:10px">🌙 <b>야간선물</b> ${esc(m.night_futures)}</div>
    <h3>시초가 예상</h3>${op("코스피", m.kospi_open, m.kospi_reason)}${op("코스닥", m.kosdaq_open, m.kosdaq_reason)}
    <h3>밤사이 주요 변수</h3><ul>${m.overnight.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
    ${calls(m.sectors_up, "up", "▲ 강세 예상")}${calls(m.sectors_down, "dn", "▼ 약세 예상")}
    ${m.events.length ? `<h3>이벤트</h3><ul>${m.events.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    ${sources(page, m.article_ids)}
    <div class="warn">AI가 기사로 예상한 내용이며 투자 권유가 아닙니다. 투자 판단은 본인 책임입니다.</div></section>`; })() : ""}
  <section class="card ga" id="top3"><h2>🔥 오늘의 핵심</h2><ul class="hl">${b.headlines.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></section>
  <section class="card ins ga" id="insight"><h2>💡 오늘의 시사점</h2>
    ${b.insight_easy ? `<div class="easy"><div class="et">🧒 쉽게 풀어보기</div>
      <div class="er"><b>무슨 일?</b><span>${esc(b.insight_easy.what)}</span></div>
      <div class="er"><b>어떤 영향?</b><span>${esc(b.insight_easy.impact)}</span></div>
      <div class="er"><b>그래서?</b><span>${esc(b.insight_easy.result)}</span></div>
      ${b.insight_it ? `<div class="er sub"><b>IT·AI</b><span>${esc(b.insight_it)}</span></div>` : ""}
      ${b.insight_market ? `<div class="er sub"><b>증시</b><span>${esc(b.insight_market)}</span></div>` : ""}</div>` : ""}
    ${b.insight.map(t=>`<p>▸ ${esc(t)}</p>`).join("")}</section>
  ${b.sections.map((s,i)=>`<section class="card gb" id="sec-${i}"><h2><span class="dot" style="background:var(--c${i%6})"></span>${ICONS[s.name] || "📰"} ${esc(s.name)}</h2>
    ${s.items.slice(0,3).map(it=>item(page,it)).join("")}</section>`).join("")}
  <section class="card gb" id="views"><h2>🔍 국내 vs 외신 시각</h2>${b.perspectives.map(p=>`<div class="pv"><b>${esc(p.topic)}</b>
    <div><span class="tag kr">국내</span>${esc(p.domestic)}</div><div><span class="tag fx">외신</span>${esc(p.foreign)}</div>${sources(page,p.article_ids)}</div>`).join("")}</section>
  <section class="card gb" id="sched"><h2>📅 오늘의 일정</h2>${b.schedule.length ? b.schedule.map(s=>`<div class="sc"><span class="t">${esc(s.time)}</span><span class="r">${esc(s.region)}</span><span>${esc(s.event)}</span></div>`).join("") : '<div class="meta">확인된 일정이 없습니다.</div>'}</section>
  <section class="card gb" id="kw"><h2>🎯 관심 키워드</h2>${b.keywords.map(k=>`<div class="kw"><h3># ${esc(k.keyword)} <span class="meta">${k.items.length}건</span></h3>
    ${k.items.length ? k.items.map(it=>item(page,it)).join("") : '<div class="none">오늘은 관련 뉴스가 없습니다.</div>'}</div>`).join("")}</section>
  <footer>AI(Gemini)가 기사를 요약했습니다. 중요한 내용은 원문을 확인하세요.</footer>
  <div class="print-only print-foot">AI(Gemini)가 국내외 기사를 요약한 자료입니다. 장 전망은 예상이며 투자 권유가 아닙니다 · wiohworkson-sketch.github.io/news-briefing</div>`;
  $("#day").onchange = e => { history.replaceState(null, "", `?d=${e.target.value}`); show(e.target.value); };
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

async function printA3(date){
  try { const r = await fetch(`pdf/${date}.pdf`, {method: "HEAD", cache: "no-store"});
        if (r.ok) { location.href = `pdf/${date}.pdf?v=${Date.now()}`; return; } } catch(e) {}
  window.print();
}

async function show(date){
  try { render(await getJSON(`data/${date}.json`)); $("#lock").hidden = true; $("#app").hidden = false; }
  catch(e){ $("#app").hidden = true; $("#lock").hidden = false; $("#err").textContent = "브리핑을 불러오지 못했습니다. 잠시 후 다시 열어주세요."; }
}

function current(){ const d = new URLSearchParams(location.search).get("d"); return dates.includes(d) ? d : dates[0]; }

(async () => {
  try { dates = await getJSON("data/index.json"); } catch(e) { dates = []; }
  if (!dates.length) { $("#lock").hidden = false; $("#err").textContent = "아직 발행된 브리핑이 없습니다."; return; }
  show(current());
})();
</script>
</body>
</html>
