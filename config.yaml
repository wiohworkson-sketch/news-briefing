# ============================================================
#  아침 뉴스 브리핑 설정 파일
#  - 이 파일만 고치면 키워드·언론사·지표를 바꿀 수 있습니다.
#  - GitHub 웹사이트에서 이 파일을 열고 연필(✏️) 버튼으로 수정하세요.
#  - 줄 앞의 공백(들여쓰기)은 그대로 유지해야 합니다.
# ============================================================

# 브리핑을 만들 AI 모델 (Google Gemini 무료 버전)
model: gemini-3.8-flash

# 분야별로 담을 뉴스 개수
items_per_section: 4

# 관심 키워드 (원하는 만큼 추가/삭제)
keywords:
  - 반도체·AI칩
  - 부동산 정책
  - 미국 금리·연준
  - 미중 무역·관세

# 브리핑 분야 (이름을 바꾸면 카톡/웹페이지 제목도 바뀝니다)
sections:
  - 증시·경제
  - 정치·국제
  - IT·AI
  - 바이오·제약
  - 사회·생활

# 시장 지표 (이름은 6글자 이내, scale: 곱할 값 — 예: 100엔당 원화)
markets:
  - { name: 원/달러, ticker: "KRW=X", unit: "원" }
  - { name: 원/100엔, ticker: "JPYKRW=X", unit: "원", scale: 100 }
  - { name: 美10년물, ticker: "^TNX", unit: "%" }
  - { name: WTI유가, ticker: "CL=F", unit: "$" }
  - { name: 금, ticker: "GC=F", unit: "$" }
  - { name: 비트코인, ticker: "BTC-USD", unit: "$" }

