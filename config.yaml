# ============================================================
#  아침 뉴스 브리핑 설정 파일
#  - 이 파일만 고치면 키워드·언론사·지표를 바꿀 수 있습니다.
#  - GitHub 웹사이트에서 이 파일을 열고 연필(✏️) 버튼으로 수정하세요.
#  - 줄 앞의 공백(들여쓰기)은 그대로 유지해야 합니다.
# ============================================================

# 브리핑을 만들 AI 모델 (Google Gemini 무료 버전)
model: gemini-3.8-flash

# 분야별로 담을 뉴스 개수
items_per_section: 3

# 관심 키워드 (원하는 만큼 추가/삭제)
# name: 화면에 보이는 이름 / hint: AI가 관련 뉴스를 고를 때 참고하는 설명
keywords:
  - { name: 타이어, hint: "한국타이어·금호타이어·넥센타이어 등 타이어 업계, 천연고무·합성고무 가격, 자동차 수요" }
  - { name: 항공(+유가), hint: "대한항공·아시아나·저비용항공사 등 항공업계, 여객·화물 수요, 국제유가·항공유 가격" }
  - { name: 파이프(PE), hint: "폴리에틸렌(PE) 파이프·배관 업계, PE 원료 가격과 석유화학 업황, 플라스틱 파이프, 건설·상하수도·가스관 수요" }

# 브리핑 분야 (이름을 바꾸면 카톡/웹페이지 제목도 바뀝니다)
sections:
  - 증시·경제
  - 부동산
  - 정치·국제
  - IT·AI
  - 바이오·제약
  - 사회·생활

# 시장 지표 (이름은 6글자 이내, scale: 곱할 값 — 예: 100엔당 원화)
markets:
  - { name: 원/달러, ticker: "KRW=X", unit: "원" }
  - { name: 원/100엔, ticker: "JPYKRW=X", unit: "원", scale: 100 }
  - { name: 美10년물, ticker: "^TNX", unit: "%" }
  - { name: WTI유가, ticker: "CL=F", unit: "$" }
  - { name: 금, ticker: "GC=F", unit: "$" }
  - { name: 비트코인, ticker: "BTC-USD", unit: "$" }

# 오늘 장 전망용 지표 (전일 국내 지수 + 밤사이 미국 시장)
# EWY = 미국에 상장된 한국 주식 ETF로, 밤사이 한국 증시 분위기를 보여줌
outlook_markets:
  - { name: 코스피, ticker: "naver:KOSPI", unit: "pt" }
  - { name: 코스닥, ticker: "naver:KOSDAQ", unit: "pt" }
  - { name: 나스닥, ticker: "^IXIC", unit: "pt" }
  - { name: S&P500, ticker: "^GSPC", unit: "pt" }
  - { name: 美반도체, ticker: "^SOX", unit: "pt" }
  - { name: 한국ETF, ticker: "EWY", unit: "$" }

